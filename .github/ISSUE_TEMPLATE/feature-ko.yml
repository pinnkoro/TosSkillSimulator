name: ✨ 기능 제안 (한국어)
description: 추가했으면 하는 기능, 불편한 부분의 개선안
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 불편한 점
      description: 무엇을 하고 싶은데 지금은 어떻게 불편한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 원하는 동작
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 참고
      description: 다른 시뮬레이터의 구현 방식, 링크 등 참고가 될 만한 것
