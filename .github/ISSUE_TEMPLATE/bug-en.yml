name: 🐛 Bug report (English)
description: Broken layout, something you cannot interact with, wrong calculation
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe what you saw. A screenshot helps a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Pick the "Swordsman" tree
        2. Put "Highlander" in slot 1
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: build-url
    attributes:
      label: Shared build URL
      description: The URL from the "share" button — it lets us reproduce your exact build.
      placeholder: https://pinnkoro.github.io/TosSkillSimulator/#...
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser and version, OS, UI language (日本語 / 한국어)
      placeholder: Firefox 140 / Windows 11 / 日本語
    validations:
      required: true
