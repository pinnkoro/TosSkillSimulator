name: CI

# main への PR と main への push で回す。main 保護の必須チェックはこの check ジョブ。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチで PR を連続 push したときは古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # build は内部で tsc -b も回すので、型チェックはここで兼ねる
      - run: npm run build
