name: 📊 데이터 오류 (한국어)
description: 스킬·직업·바이보라의 값이나 이름이 게임과 다릅니다
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        데이터는 게임 클라이언트의 IES에서 자동으로 추출합니다.
        앱의 동작이 아니라 "값 자체가 다르다"면 이 템플릿을 사용해 주세요.
  - type: input
    id: target
    attributes:
      label: 대상
      description: 클래스명 / 스킬명 (가능하면 한국어와 영어 둘 다)
      placeholder: 하이랜더 / Cartar Stroke
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: 현재 표시되는 값
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: 올바른 값
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 근거
      description: 게임 내 스크린샷, 공식 패치 노트의 해당 부분 등
